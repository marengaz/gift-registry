name: Release
on:
  push:
    branches: [main]
  schedule:
    # Weekly OS security rebuild (Monday 03:23 UTC)
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      rebuild_os:
        description: Rebuild without cache and cut a patch release if OS packages or base digest changed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  detect-os-updates:
    name: Check for OS image updates
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_os))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      needed: ${{ steps.compare.outputs.needed }}
      summary: ${{ steps.compare.outputs.summary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compare fresh runtime build against published latest image
        id: compare
        env:
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repo_lower=$(printf '%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')
          latest_image="ghcr.io/${repo_lower}:latest"
          base_image=$(awk '/^FROM .* AS runtime$/ { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; exit } }' Dockerfile)
          docker pull "$base_image"
          new_base_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base_image")

          docker build --pull --no-cache --build-arg BASE_IMAGE_DIGEST="$new_base_digest" --tag family-gifts:os-check .
          docker run --rm --entrypoint dpkg-query family-gifts:os-check -W -f='${Package}=${Version}\n' | sort > "$RUNNER_TEMP/new-packages.txt"

          delimiter="EOF_OS_SUMMARY_${GITHUB_RUN_ID}"
          if ! docker pull "$latest_image"; then
            {
              echo "needed=true"
              echo "summary<<${delimiter}"
              echo "- Initial weekly OS baseline image build."
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_base_digest=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "$latest_image" 2>/dev/null || true)
          if [[ "$old_base_digest" == "<no value>" ]]; then
            old_base_digest=""
          fi
          docker run --rm --entrypoint dpkg-query "$latest_image" -W -f='${Package}=${Version}\n' | sort > "$RUNNER_TEMP/old-packages.txt"

          pkg_diff=$(python3 - "$RUNNER_TEMP/old-packages.txt" "$RUNNER_TEMP/new-packages.txt" <<'PY'
          import sys
          def load(path):
            items = {}
            with open(path, encoding="utf-8") as handle:
              for line in handle:
                if "=" in line:
                  pkg, ver = line.rstrip("\n").split("=", 1)
                  items[pkg] = ver
            return items
          old, new = load(sys.argv[1]), load(sys.argv[2])
          changes = []
          for pkg in sorted(set(old) | set(new)):
            if old.get(pkg) != new.get(pkg):
              changes.append(f"- `{pkg}`: `{old.get(pkg, 'absent')}` -> `{new.get(pkg, 'removed')}`")
          for line in changes[:40]:
            print(line)
          if len(changes) > 40:
            print(f"- ... and {len(changes) - 40} more package changes")
          PY
          )

          if [[ "$old_base_digest" == "$new_base_digest" && -z "$pkg_diff" ]]; then
            {
              echo "needed=false"
              echo "summary="
            } >> "$GITHUB_OUTPUT"
            echo "Container base image and Debian packages match latest published release; skipping rebuild." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "needed=true"
            echo "summary<<${delimiter}"
            if [[ "$old_base_digest" != "$new_base_digest" ]]; then
              printf -- '- Base image digest: %s -> %s\n' "${old_base_digest:-untracked}" "$new_base_digest"
            fi
            if [[ -n "$pkg_diff" ]]; then
              echo "$pkg_diff"
            fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
  checks:
    needs: [detect-os-updates]
    if: >-
      always() && !cancelled() &&
      (needs.detect-os-updates.result == 'skipped' ||
       (needs.detect-os-updates.result == 'success' && needs.detect-os-updates.outputs.needed == 'true'))
    uses: ./.github/workflows/checks.yml
  publish:
    name: Publish container and release
    needs: [detect-os-updates, checks]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      (needs.detect-os-updates.result == 'skipped' ||
       (needs.detect-os-updates.result == 'success' && needs.detect-os-updates.outputs.needed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
      - name: Plan automatic version
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REBUILD_OS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_os) }}
        run: |
          if [[ "$REBUILD_OS" == "true" ]]; then
            node scripts/release.mjs plan --rebuild
          else
            node scripts/release.mjs plan
          fi
      - name: Resolve base image digest and lowercase registry name
        if: steps.release.outputs.publish == 'true'
        id: base_image
        env:
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(awk '/^FROM .* AS runtime$/ { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; exit } }' Dockerfile)
          docker pull "$base_image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base_image")
          repo_lower=$(printf '%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')
          {
            echo "digest=${digest}"
            echo "repo_lower=${repo_lower}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.release.outputs.publish == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.release.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image by digest
        if: steps.release.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_os) }}
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BASE_IMAGE_DIGEST=${{ steps.base_image.outputs.digest }}
          outputs: type=image,name=ghcr.io/${{ steps.base_image.outputs.repo_lower }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: true
          sbom: true
      - name: Verify published image
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/${{ steps.base_image.outputs.repo_lower }}@${{ steps.image.outputs.digest }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
          BASE_IMAGE_DIGEST: ${{ steps.base_image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          bash scripts/container-smoke.sh "$IMAGE" "$IMAGE_VERSION"
          docker image inspect "$IMAGE" | jq --exit-status --arg version "$IMAGE_VERSION" --arg revision "$GITHUB_SHA" --arg base "$BASE_IMAGE_DIGEST" '.[0] | .Architecture == "amd64" and .Config.Labels["org.opencontainers.image.version"] == $version and .Config.Labels["org.opencontainers.image.revision"] == $revision and .Config.Labels["org.opencontainers.image.base.digest"] == $base'
      - name: Tag verified image
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/${{ steps.base_image.outputs.repo_lower }}@${{ steps.image.outputs.digest }}
          REPO: ghcr.io/${{ steps.base_image.outputs.repo_lower }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${REPO}:${IMAGE_VERSION}" \
            --tag "${REPO}:${RELEASE_TAG}" \
            --tag "${REPO}:sha-${GITHUB_SHA}" \
            --tag "${REPO}:latest" \
            "$IMAGE"
      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_LOWER: ${{ steps.base_image.outputs.repo_lower }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OS_SUMMARY: ${{ needs.detect-os-updates.outputs.summary }}
        shell: bash
        run: |
          {
            printf 'Container: ghcr.io/%s:%s\n\nDigest: %s\n' "$REPO_LOWER" "$IMAGE_VERSION" "$IMAGE_DIGEST"
            if [[ -n "$OS_SUMMARY" ]]; then
              printf '\n### Weekly OS package updates\n\n%s\n' "$OS_SUMMARY"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          notes=$(cat "$RUNNER_TEMP/release-notes.md")
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --notes "$notes"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
