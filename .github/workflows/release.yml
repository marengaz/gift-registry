name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    name: Publish container and release
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
      - name: Plan automatic version
        id: release
        run: node scripts/release.mjs plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.release.outputs.publish == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.release.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        if: steps.release.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: true
          sbom: true
      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          printf 'Container: ghcr.io/%s:%s\n\nDigest: %s\n' "$GH_REPO" "$IMAGE_VERSION" "$IMAGE_DIGEST" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
