name: Application checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: npm
      - name: Validate PR title
        run: node scripts/release.mjs title
      - name: Scan full history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .
      - name: Lint GitHub workflows
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Validate source and release Compose configurations
        env:
          ORIGIN: https://gifts.example.org
          BETTER_AUTH_SECRET: compose-check-placeholder-not-a-real-secret
          GOOGLE_CLIENT_ID: compose-check-placeholder
          GOOGLE_CLIENT_SECRET: compose-check-placeholder
          ADMINISTRATOR_EMAIL: smoke@example.org
          PUBLIC_HOSTNAME: gifts.example.org
          ACME_EMAIL: smoke@example.org
          GIFT_IMAGE: ghcr.io/marengaz/gift-registry:0.1.0
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f compose.yaml -f compose.release.yaml config --quiet
      - name: Build and smoke-test container
        run: |
          docker build --tag family-gifts:check .
          bash scripts/container-smoke.sh family-gifts:check
