name: Renovate
on:
  schedule:
    # Run daily at 03:17 UTC so vulnerability alerts open promptly and Monday GMT/BST runs stay before 08:00 Europe/London.
    - cron: '17 3 * * *'
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    name: Update dependencies
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check whether open Renovate PRs exist after merge
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request_target" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh pr list --repo "$GH_REPO" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("renovate/"))] | length')
          if [[ "$count" -gt 0 ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.gate.outputs.should_run == 'true'
        with:
          persist-credentials: false
      - name: Mint scoped GitHub App token
        id: app_token
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOPATCH_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - name: Resolve bot identity and update repaired PR branches
        id: bot_identity
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          echo "username=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"

          # Renovate skips rebasing branches that carry non-Renovate repair commits; merge base instead.
          open_prs=$(gh pr list --repo "$GH_REPO" --state open --json number,author,headRefName,mergeStateStatus,commits)
          mapfile -t repaired_behind < <(
            jq -r --arg app "app/${APP_SLUG}" '
              .[]
              | select(.author.login == $app)
              | select(.headRefName | startswith("renovate/"))
              | select(.mergeStateStatus == "BEHIND")
              | select([.commits[].messageHeadline | contains("[agent-repair]")] | any)
              | .number
            ' <<< "$open_prs"
          )
          for pr_number in "${repaired_behind[@]}"; do
            gh pr update-branch "$pr_number" --repo "$GH_REPO" || echo "::warning::Could not update repaired PR #${pr_number}"
          done
      - name: Run Renovate
        if: steps.gate.outputs.should_run == 'true'
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: renovate.json
          token: ${{ steps.app_token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_USERNAME: ${{ steps.bot_identity.outputs.username }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
